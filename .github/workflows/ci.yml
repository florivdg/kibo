name: CI

# The shared gate. Runs as part of the Docker workflow (pull requests against
# main, pushes to main and version tags), which pushes nothing before this is
# green — so no pull_request trigger of its own, that would only double every
# run.
on:
  workflow_call:
  workflow_dispatch:

# Reads the repository, nothing else. Called from docker.yml it can't get more
# than the caller grants anyway.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04

    services:
      # Tests that need the database (schema, queries, rate limits) run against
      # the same Postgres version as production
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kibo
          POSTGRES_PASSWORD: kibo_ci_password
          POSTGRES_DB: kibo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kibo -d kibo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kibo:kibo_ci_password@localhost:5432/kibo
      BETTER_AUTH_URL: http://localhost:4321
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned so a Bun release cannot break the gate on its own
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Migrate the test database
        run: bun run db:migrate

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run test
